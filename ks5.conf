# =============================================================================
#  ks5.conf — Paramètres de ks5-setup.sh
#  Toutes les valeurs sont proposées par défaut pendant les questions du script
#  (Entrée pour garder). Avec -y, elles sont appliquées telles quelles.
#  Le fichier est exécuté par le script : il doit appartenir à root (chmod 600).
# =============================================================================

# --- Matériel (vide = détecté sur le serveur, sinon référence KS-5) ---------
# Référence KS-5 (catalogue OVH) : Xeon E3-1270 v6 4 cœurs / 8 threads,
# 32 ou 64 Go ECC, disques au choix : 2×2 To HDD (défaut), 3×4 To HDD,
# 2×450 Go NVMe, 2×1,2 To NVMe, 3×960 Go SSD (RAID matériel).
HW_THREADS=""                    # ex. 8
HW_RAM_GB=""                     # ex. 64
HW_DISK_TYPE=""                  # hdd | ssd | nvme
HW_RAID=""                       # raid1 | raid10 | raid5 | raid6 | hw | aucun
HW_USABLE_GB=""                  # capacité utile du stockage des VM, en Go
ZFS_ARC_MAX_GB=""                # vide = 1/8 de la RAM (HDD) ou 1/16 (SSD/NVMe), entre 2 et 16
HOST_RESERVE_GB=3                # mémoire gardée pour Proxmox lui-même
DISK_BUDGET_PCT=75               # part du stockage allouable aux disques de VM

# --- Général -------------------------------------------------------------------
TIMEZONE="Africa/Bamako"
ADMIN_EMAIL=""                   # reçoit pannes disque, échecs de sauvegarde, alertes d'espace

# Relais SMTP facultatif (recommandé : les mails directs d'un serveur arrivent souvent en spam).
# Exemple Brevo : smtp-relay.brevo.com, port 587, identifiant et clé SMTP du compte.
SMTP_HOST=""
SMTP_PORT=587
SMTP_MODE="starttls"             # starttls (587) | tls (465)
SMTP_USER=""
SMTP_PASSWORD=""                 # secret : laisser vide, le script le demande en saisie masquée
SMTP_FROM=""                     # adresse d'un domaine validé chez le relais

# --- Accès et sécurité -------------------------------------------------------
SSH_PORT=22
SSH_ALLOW_FROM=""                # CIDR séparés par des espaces ; vide = SSH public ouvert à tous (clé uniquement)
ENABLE_FIREWALL=1                # pare-feu Proxmox (indispensable)
VM_ISOLATION=1                   # pare-feu par VM : entrées limitées au routeur web (80/443), à Coolify et à l'hôte (SSH)
GUI_LAN_ONLY=1                   # interface 8006 en écoute sur l'adresse privée : publiée seulement par le routeur web
ROLLBACK_DELAY=300               # secondes pour confirmer une nouvelle connexion SSH avant restauration

# --- Administration en HTTPS, sans tunnel ------------------------------------
# Proxmox et Coolify ont chacun une adresse HTTPS ordinaire, servie par le routeur web.
# ADMIN_ALLOW_FROM : adresses des administrateurs (CIDR séparés par des espaces). Le routeur
# refuse l'interface Proxmox (et l'amorçage de Coolify) à toute autre source.
# Vide : Proxmox n'est publié que si PVE_OPEN_TO_ALL=1 (déconseillé, TOTP alors obligatoire).
ADMIN_ALLOW_FROM=""
PVE_DOMAIN=""                    # vide = proxmox.<WEB_DOMAIN> ; « - » = interface non publiée
PVE_OPEN_TO_ALL=0                # 1 = interface Proxmox publiée sans restriction d'adresse
COOLIFY_DOMAIN=""                # vide = coolify.<WEB_DOMAIN>
COOLIFY_ADMIN_ONLY=0             # 1 = Coolify aussi réservé à ADMIN_ALLOW_FROM (bloque les webhooks Git entrants)

# --- Réseau privé ------------------------------------------------------------
LAN_BRIDGE="vmbr1"
LAN_PREFIX="10.10.10"            # réseau 10.10.10.0/24, passerelle 10.10.10.1
DNS_SERVERS="1.1.1.1 9.9.9.9"

# --- Stockage ----------------------------------------------------------------
STORAGE=""                       # vide = choix automatique (ZFS existant, sinon dataset VMDATA_DATASET à créer)
VMDATA_DATASET="vmdata"          # nom du dataset et du stockage créés sur le pool ZFS d'OVH

# --- Modèle de VM ------------------------------------------------------------
TEMPLATE_ID=9000
UBUNTU_RELEASE="noble"           # noble = 24.04 LTS (conseillé), resolute = 26.04 LTS
CI_USER="ubuntu"

# --- Sites publics : routeur web (conteneur HAProxy) ------------------------
# 80/443 de l'IP publique arrivent sur le routeur, qui aiguille chaque domaine vers sa VM
# sans déchiffrer (chaque VM obtient ses propres certificats Let's Encrypt).
# Routes par défaut : 9e champ de VMS (noms courts → <nom>.<WEB_DOMAIN>, sous-domaines compris),
# plus COOLIFY_DOMAIN vers la VM Coolify.
# WEB_ROUTES non vide remplace ces routes. Format : ".domaine|ID" = ce domaine et ses sous-domaines.
# Domaine inconnu : refusé (404 / connexion fermée), sauf si WEB_DEFAULT_VM désigne une VM.
# Les routes ne sont écrites qu'à la création ; ensuite : /etc/haproxy/domaines.map dans le conteneur.
WEB_DOMAIN="uninef.org"
WEB_DEFAULT_VM=""
WEB_ROUTES=()

# --- Sauvegardes locales Proxmox ---------------------------------------------
# vzdump fait des copies complètes à chaque passage : garder peu de copies sur les mêmes disques,
# la vraie sauvegarde est hors du serveur (voir README, section 5 et BACKUP_REMOTE_STORAGE).
BACKUP_STORAGE="local"
BACKUP_SCHEDULE="02:00"
BACKUP_KEEP_DAILY=3
BACKUP_KEEP_WEEKLY=2
# Copie hors serveur : nom d'un stockage Proxmox distant déjà ajouté (Datacenter › Storage ›
# Add › Proxmox Backup Server, NFS, CIFS…). Vide = aucune copie hors serveur (déconseillé en production).
BACKUP_REMOTE_STORAGE=""
BACKUP_REMOTE_SCHEDULE="03:30"
BACKUP_REMOTE_KEEP_DAILY=7
BACKUP_REMOTE_KEEP_WEEKLY=4
BACKUP_REMOTE_KEEP_MONTHLY=6
DISK_ALERT_PCT=80                # alerte mail quotidienne au-delà de ce taux d'occupation

# --- Conteneur du routeur web (HAProxy) --------------------------------------
CT_ID=100
CT_NAME="entree"
CT_IP_SUFFIX=10
CT_CORES=1
CT_MEM_MB=512
CT_DISK_GB=8

# --- Machines virtuelles -----------------------------------------------------
# Format : "ID|nom|vCPU|RAM_Go|Disque_Go|IP(dernier octet)|profil|ordre_démarrage|domaines"
# Profils : coolify = installe Coolify (une seule instance, qui pilote toutes les autres VM)
#           managed = serveur Docker piloté par Coolify (reçoit la clé Coolify, root par clé)
#           base    = Ubuntu seul
# domaines : noms séparés par des virgules ; « kobo » = kobo.<WEB_DOMAIN> et ses sous-domaines,
#            un nom contenant un point est pris tel quel. Facultatif.
# Une VM par grande stack, toutes déployées depuis l'unique Coolify (101) :
#   102 kobo          KoboToolbox complet (Compose déployé par Coolify)
#   103 data-bi       PostgreSQL/PostGIS, Metabase, Redash, Lightdash, Grist, Teable
#   104 observatoire  Django / Wagtail
#   105 recette       essais (facultative : la retirer pendant les questions si inutile)
# Prévu pour 64 Go / 2×2 To ; sur une autre configuration, le script propose de réduire.
VMS=(
  "101|coolify|2|6|60|11|coolify|2|"
  "102|kobo|4|14|300|12|managed|3|kobo,enketo,kc"
  "103|data-bi|4|18|500|13|managed|3|monitoring,redash,lightdash,grist,teable"
  "104|observatoire|2|8|150|14|managed|4|observatoire"
  "105|recette|2|4|100|15|managed|5|test"
)

# Règles d'entrée supplémentaires par VM (syntaxe du pare-feu Proxmox), ajoutées à la création.
# « @ID » est remplacé par l'adresse de la VM ID. Seuls les flux nécessaires entre stacks :
#   observatoire (104) → PostgreSQL/PostGIS de data-bi (103), port 5432.
# La synchronisation data-bi → API Kobo passe par https://kobo.<WEB_DOMAIN> (routeur web) :
# aucune règle n'est nécessaire, le certificat reste valide.
VM_FW_EXTRA=(
  "103|IN ACCEPT -source @104 -p tcp -dport 5432 -log nolog # PostgreSQL/PostGIS pour l'observatoire (104)"
)
