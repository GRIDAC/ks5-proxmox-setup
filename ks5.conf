# =============================================================================
#  ks5.conf — Paramètres de ks5-setup.sh
#  Toutes les valeurs sont proposées par défaut pendant les questions du script
#  (Entrée pour garder). Avec -y, elles sont appliquées telles quelles.
#  Le fichier est exécuté par le script : il doit appartenir à root (chmod 600).
# =============================================================================

# --- Matériel (vide = détecté sur le serveur, sinon référence KS-5) ---------
# Référence KS-5 (catalogue OVH) : Xeon E3-1270 v6 4 cœurs / 8 threads,
# 32 ou 64 Go ECC, disques au choix : 2×2 To HDD (défaut), 3×4 To HDD,
# 2×450 Go NVMe, 2×1,2 To NVMe, 3×960 Go SSD (RAID matériel).
HW_THREADS=""                    # ex. 8
HW_RAM_GB=""                     # ex. 64
HW_DISK_TYPE=""                  # hdd | ssd | nvme
HW_RAID=""                       # raid1 | raid10 | raid5 | raid6 | hw | aucun
HW_USABLE_GB=""                  # capacité utile du stockage des VM, en Go
ZFS_ARC_MAX_GB=""                # vide = 1/8 de la RAM (HDD) ou 1/16 (SSD/NVMe), entre 2 et 16
HOST_RESERVE_GB=3                # mémoire gardée pour Proxmox lui-même
DISK_BUDGET_PCT=75               # part du stockage allouable aux disques de VM

# --- Général -------------------------------------------------------------------
TIMEZONE="Africa/Bamako"
ADMIN_EMAIL=""                   # reçoit pannes disque, échecs de sauvegarde, alertes d'espace

# Relais SMTP facultatif (recommandé : les mails directs d'un serveur arrivent souvent en spam).
# Exemple Brevo : smtp-relay.brevo.com, port 587, identifiant et clé SMTP du compte.
SMTP_HOST=""
SMTP_PORT=587
SMTP_MODE="starttls"             # starttls (587) | tls (465)
SMTP_USER=""
SMTP_PASSWORD=""                 # secret : laisser vide, le script le demande en saisie masquée
SMTP_FROM=""                     # adresse d'un domaine validé chez le relais

# --- Accès et sécurité -------------------------------------------------------
SSH_PORT=22
SSH_ALLOW_FROM=""                # CIDR séparés par des espaces ; vide = SSH public ouvert à tous (clé uniquement)
ENABLE_FIREWALL=1                # pare-feu Proxmox (indispensable)
VM_ISOLATION=1                   # pare-feu par VM : entrées limitées au routeur web (80/443), à Coolify et à l'hôte (SSH)
GUI_LAN_ONLY=1                   # interface 8006 en écoute sur l'adresse privée uniquement (accès par tunnel SSH)
ROLLBACK_DELAY=300               # secondes pour confirmer une nouvelle connexion SSH avant restauration

# --- Réseau privé ------------------------------------------------------------
LAN_BRIDGE="vmbr1"
LAN_PREFIX="10.10.10"            # réseau 10.10.10.0/24, passerelle 10.10.10.1
DNS_SERVERS="1.1.1.1 9.9.9.9"

# --- Stockage ----------------------------------------------------------------
STORAGE=""                       # vide = choix automatique (ZFS existant, sinon dataset VMDATA_DATASET à créer)
VMDATA_DATASET="vmdata"          # nom du dataset et du stockage créés sur le pool ZFS d'OVH

# --- Modèle de VM ------------------------------------------------------------
TEMPLATE_ID=9000
UBUNTU_RELEASE="noble"           # noble = 24.04 LTS (conseillé), resolute = 26.04 LTS
CI_USER="ubuntu"

# --- Sites publics : routeur web (conteneur HAProxy) ------------------------
# 80/443 de l'IP publique arrivent sur le routeur, qui aiguille chaque domaine vers sa VM
# sans déchiffrer (chaque VM obtient ses propres certificats Let's Encrypt).
# Format d'une route : ".domaine|ID" = ce domaine et tous ses sous-domaines vers la VM ID.
# Vide = routes par défaut : .kobo/.ee/.kc.<WEB_DOMAIN> → VM kobo, .test.<WEB_DOMAIN> → perso-tests.
# Tout autre domaine va à WEB_DEFAULT_VM (vide = uninef-prod).
# Les routes ne sont écrites qu'à la création ; ensuite : /etc/haproxy/domaines.map dans le conteneur.
WEB_DOMAIN="uninef.org"
WEB_DEFAULT_VM=""
WEB_ROUTES=()

# --- Sauvegardes locales Proxmox ---------------------------------------------
# vzdump fait des copies complètes à chaque passage : garder peu de copies sur les mêmes disques,
# la vraie sauvegarde est hors du serveur (voir LISEZMOI, section 5).
BACKUP_STORAGE="local"
BACKUP_SCHEDULE="02:00"
BACKUP_KEEP_DAILY=3
BACKUP_KEEP_WEEKLY=2
DISK_ALERT_PCT=80                # alerte mail quotidienne au-delà de ce taux d'occupation

# --- Conteneur du routeur web (HAProxy) --------------------------------------
CT_ID=100
CT_NAME="entree"
CT_IP_SUFFIX=10
CT_CORES=1
CT_MEM_MB=512
CT_DISK_GB=8

# --- Machines virtuelles -----------------------------------------------------
# Format : "ID|nom|vCPU|RAM_Go|Disque_Go|IP(dernier octet)|profil|ordre_démarrage"
# Profils : coolify = installe Coolify
#           managed = serveur piloté par Coolify (reçoit la clé Coolify, root par clé)
#           kobo    = Docker + kobo-install
#           base    = Ubuntu seul
# uninef-prod porte la base PostGIS, les outils BI et l'application sur le même serveur Coolify :
# la base reste sur le réseau Docker, sans être exposée.
# Prévu pour 64 Go / 2×2 To ; sur une autre configuration, le script propose de réduire.
VMS=(
  "101|coolify|2|4|50|11|coolify|2"
  "102|kobo|4|12|300|12|kobo|3"
  "103|uninef-prod|6|18|500|13|managed|3"
  "105|perso-tests|4|10|250|15|managed|5"
)

# Règles d'entrée supplémentaires par VM (syntaxe du pare-feu Proxmox), ajoutées à la création.
# Exemple : base de la VM 103 joignable depuis une VM 104 sur le port 5432
#   VM_FW_EXTRA=("103|IN ACCEPT -source 10.10.10.14 -p tcp -dport 5432 -log nolog # PostGIS pour 104")
VM_FW_EXTRA=()
